<html>
<body>
<h1>Save!</h1>
<p>this will get your cookies in an email, which can then be put on a flash drive and reuploaded, a tutorial will be posted <a href="/cookietutorial">here</a> at a later date.</p>


<!-- Place this where you want the button to appear -->
<button id="copy-cookies-btn">copy cookies</button>

<script>
  document.getElementById('copy-cookies-btn').addEventListener('click', async () => {
    try {
      // Grab cookies for this domain only
      const cookies = document.cookie; // only returns cookies for the current domain/path
      if (!cookies) {
        alert('No cookies found for this site.');
        return;
      }

      // Copy to clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(cookies);
      } else {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = cookies;
        textarea.style.position = 'fixed';  // Avoid page scrolling
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }

      // Notify user
      alert('done!');
    } catch (err) {
      console.error('Error copying cookies:', err);
      alert('failed, see console');
    }
  });
</script>

  
  


</body>



</html>
