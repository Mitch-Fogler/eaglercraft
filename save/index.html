<html>
<body>
<h1>Save!</h1>
<p>a tutorial on how to get these on a new website will be posted <a href="/cookietutorial">here</a> at a later date.</p>


<!-- Place this where you want the button to appear -->
<button id="export-eagler-world">copy worlds</button>

<script>
  document.getElementById('export-eagler-world').addEventListener('click', async () => {
    // 1. Collect only keys matching /eaglercraft/i
    const worldData = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);                                            // iterate keys :contentReference[oaicite:4]{index=4}
      if (/eaglercraft/i.test(key)) {                                             // filter with regex :contentReference[oaicite:5]{index=5}
        worldData[key] = localStorage.getItem(key);                               // read matching entries :contentReference[oaicite:6]{index=6}
      }
    }

    // 2. Serialize to pretty JSON
    const payload = JSON.stringify(worldData, null, 2);

    // 3. Copy to clipboard
    try {
      await navigator.clipboard.writeText(payload);                                // modern Clipboard API :contentReference[oaicite:7]{index=7}
      alert('✅ Eaglercraft world data copied to clipboard.');
    } catch (err) {
      // Fallback for older browsers :contentReference[oaicite:8]{index=8}
      const tmp = document.createElement('textarea');
      tmp.value = payload;
      tmp.style.position = 'fixed';
      document.body.appendChild(tmp);
      tmp.focus();
      tmp.select();
      document.execCommand('copy');
      document.body.removeChild(tmp);
      alert('✅ World data copied (fallback).');
    }
  });
</script>


  
  


</body>



</html>
