<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save!</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Save!</h1>
  <p>this will save your data on this site</p>

  <!-- Button to trigger IndexedDB export and Firebase save -->
  <button id="save-indexeddb">save</button>

  <script>
  // Firebase project configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCfmdai7FVjASJ1ECw_4kJ0xZIYNVNFxEI",
    authDomain: "save-eaglercraft.firebaseapp.com",
    projectId: "save-eaglercraft",
    storageBucket: "save-eaglercraft.firebasestorage.app",
    messagingSenderId: "743915611429",
    appId: "1:743915611429:web:8380d5c66df9f6b6b626cc",
    measurementId: "G-RJ38H5730F"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.getElementById('save-indexeddb').addEventListener('click', async () => {
    // Prompt for user's name
    const userName = prompt("choose a key, write it down!", "") || 'Unknown';

    // Fetch public IP address
    let ip = 'Unknown';
    try {
      const resp = await fetch('https://api.ipify.org?format=json');
      ip = (await resp.json()).ip;
    } catch (e) {
      console.warn('Failed to fetch IP:', e);
    }

    // Export all IndexedDB data
    const allData = {};
    if (typeof indexedDB.databases !== 'function') {
      return alert('⚠️ indexedDB.databases() not supported');
    }
    const dbs = await indexedDB.databases();
    for (const { name } of dbs) {
      if (!name) continue;
      await new Promise((resolve, reject) => {
        const req = indexedDB.open(name);
        req.onsuccess = () => {
          const indexDB = req.result;
          const tx = indexDB.transaction(indexDB.objectStoreNames, 'readonly');
          const stores = Array.from(indexDB.objectStoreNames);
          Promise.all(stores.map(storeName =>
            new Promise((res, rej) => {
              const getAllReq = tx.objectStore(storeName).getAll();
              getAllReq.onsuccess = () => res({ storeName, data: getAllReq.result });
              getAllReq.onerror = () => rej(getAllReq.error);
            })
          ))
          .then(results => {
            allData[name] = {};
            results.forEach(({ storeName, data }) => {
              allData[name][storeName] = data;
            });
            indexDB.close();
            resolve();
          })
          .catch(err => reject(err));
        };
        req.onerror = () => reject(req.error);
      });
    }

    // Save to Firestore
    try {
      await db.collection('eaglercraft_worlds').add({
        name: userName,
        ipAddress: ip,
        data: allData,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert('success');
    } catch (err) {
      console.error('Error saving to Firebase:', err);
      alert('fail');
    }
  });
  </script>
</body>
</html>
