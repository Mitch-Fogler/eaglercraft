<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save!</title>
  <!-- 1) PVUtils for Base64↔ArrayBuffer -->
  <script src="https://cdn.jsdelivr.net/npm/pvutils@1.1.3/dist/pvutils.min.js"></script>
  <!-- 2) ASN1.js for BER parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/asn1js/2.0.29/asn1js.min.js"></script>
  <!-- 3) PKI.js for PKCS#8 EncryptedPrivateKeyInfo.decrypt -->
  <script src="https://cdn.jsdelivr.net/npm/@penneo/pkijs@2.1.73/build/pkijs.min.js"></script>
  <!-- 4) jsrsasign for JWT signing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.9.0/jsrsasign-all-min.js"></script>
</head>
<body>
  <h1>Save!</h1>
  <p>This will save your data from the site to a database</p>
  <button id="save-indexeddb">save</button>

  <script>
    // ——— Box credentials ———
    const BOX_CLIENT_ID            = 'nd0tq3wbm8tab6sb7y6uaqnd6i261vfk';
    const BOX_ENTERPRISE_ID        = '0';
    const BOX_PUBLIC_KEY_ID        = '8gun8i6l';
    const BOX_FOLDER_ID            = '320902275630';

    // Your AES- or 3DES-encrypted PKCS#8 PEM
    const BOX_PRIVATE_KEY = `-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIFLTBXBgkqhkiG9w0BBQ0wSjApBgkqhkiG9w0BBQwwHAQIdBpARbj54mgCAggA
...YOUR PEM PRIVATE KEY...
-----END ENCRYPTED PRIVATE KEY-----`;

    const BOX_PRIVATE_KEY_PASSPHRASE = 'ecaa0ecb154f6123abd98aed3eccc4c7';

    let boxAccessToken = null;
    let boxTokenExpiry = 0;

    /** Decode a base64 PEM to ArrayBuffer **/
    function pemToArrayBuffer(pem) {
      const b64 = pem
        .replace(/-----[^-]+-----/g, '')
        .replace(/\s+/g, '');
      return pvutils.stringToArrayBuffer(pvutils.fromBase64(b64)); // :contentReference[oaicite:0]{index=0}
    }

    /** Decrypt any PKCS#8 EncryptedPrivateKeyInfo using PKI.js + WebCrypto **/
    async function decryptEncryptedPKCS8PEM(pem, pass) {
      // Parse the BER
      const raw = pemToArrayBuffer(pem);
      const asn1 = asn1js.fromBER(raw);                                     // :contentReference[oaicite:1]{index=1}
      // Create EncryptedPrivateKeyInfo and decrypt
      const epki = new pkijs.EncryptedPrivateKeyInfo({ schema: asn1.result });
      const decryptedBuffer = await epki.decrypt(pass);                     // 
      return decryptedBuffer; // ArrayBuffer of plain PrivateKeyInfo DER
    }

    /** Convert ArrayBuffer → hex string **/
    function ab2hex(buffer) {
      const u8 = new Uint8Array(buffer);
      return Array.from(u8)
        .map(b => ('0' + b.toString(16)).slice(-2))
        .join('');
    }

    async function getBoxAccessToken() {
      const now = KJUR.jws.IntDate.get('now');
      if (boxAccessToken && now < boxTokenExpiry - 60) return boxAccessToken;

      // 1) JWT header & payload
      const header = { alg:'RS512', typ:'JWT', kid:BOX_PUBLIC_KEY_ID };
      const payload = {
        iss: BOX_CLIENT_ID,
        sub: BOX_ENTERPRISE_ID,
        box_sub_type: 'enterprise',
        aud: 'https://api.box.com/oauth2/token',
        jti: KJUR.crypto.Util.getRandomHexOfNbytes(16),
        iat: now,
        exp: now + 45
      };

      // 2) Decrypt your PEM → ArrayBuffer → hex → RSAKey
      const plainKeyBuf = await decryptEncryptedPKCS8PEM(
        BOX_PRIVATE_KEY,
        BOX_PRIVATE_KEY_PASSPHRASE
      );
      const plainKeyHex = ab2hex(plainKeyBuf);
      const prvKeyObj = KEYUTIL.getKey(plainKeyHex, null, 'hex');           // :contentReference[oaicite:3]{index=3}

      // 3) Sign the JWT assertion
      const assertion = KJUR.jws.JWS.sign(
        'RS512',
        JSON.stringify(header),
        JSON.stringify(payload),
        prvKeyObj
      );                                                                    // :contentReference[oaicite:4]{index=4}

      // 4) Exchange for access token
      const body = `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${encodeURIComponent(assertion)}`;
      const resp = await fetch('https://api.box.com/oauth2/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      if (!resp.ok) throw new Error('Token request failed: ' + await resp.text());
      const data = await resp.json();
      boxAccessToken = data.access_token;
      boxTokenExpiry  = now + data.expires_in;
      return boxAccessToken;
    }

    async function uploadToBox(fileName, blob) {
      const token = await getBoxAccessToken();
      const form  = new FormData();
      form.append('attributes', JSON.stringify({ name: fileName, parent: { id: BOX_FOLDER_ID } }));
      form.append('file', blob, fileName);
      const resp = await fetch('https://upload.box.com/api/2.0/files/content', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: form
      });
      if (!resp.ok) throw new Error('Upload failed: ' + await resp.text());
      return resp.json();
    }

    document.getElementById('save-indexeddb').addEventListener('click', async () => {
      // … your IndexedDB export & simple password check …
    });
  </script>
</body>
</html>
