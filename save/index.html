<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save!</title>
  <!-- jsrsasign 10.9.0+ for AES-capable encrypted‐PEM support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.9.0/jsrsasign-all-min.js"></script>
</head>
<body>
  <h1>Save!</h1>
  <p>This will save your data from the site to a database</p>
  <button id="save-indexeddb">save</button>

  <script>
    // --- Box API credentials ---
    const BOX_CLIENT_ID            = 'nd0tq3wbm8tab6sb7y6uaqnd6i261vfk';
    const BOX_ENTERPRISE_ID        = '0';
    const BOX_PUBLIC_KEY_ID        = '8gun8i6l';
    const BOX_FOLDER_ID            = '320902275630';

    // <-- Your AES- or 3DES-encrypted PKCS#8 PEM -->
    const BOX_PRIVATE_KEY = `-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIFLTBXBgkqhkiG9w0BBQ0wSjApBgkqhkiG9w0BBQwwHAQIdBpARbj54mgCAggA
...YOUR PEM PRIVATE KEY...
-----END ENCRYPTED PRIVATE KEY-----
`;

    // The passphrase that decrypts the above PEM
    const BOX_PRIVATE_KEY_PASSPHRASE = 'ecaa0ecb154f6123abd98aed3eccc4c7';

    // In-memory token cache
    let boxAccessToken = null;
    let boxTokenExpiry = 0;

    async function getBoxAccessToken() {
      const now = KJUR.jws.IntDate.get('now');
      if (boxAccessToken && now < boxTokenExpiry - 60) return boxAccessToken;

      // 1) Build JWT header & payload
      const header = { alg:'RS512', typ:'JWT', kid:BOX_PUBLIC_KEY_ID };
      const payload = {
        iss: BOX_CLIENT_ID,
        sub: BOX_ENTERPRISE_ID,
        box_sub_type: 'enterprise',
        aud: 'https://api.box.com/oauth2/token',
        jti: KJUR.crypto.Util.getRandomHexOfNbytes(16),
        iat: now,
        exp: now + 45
      };

      // 2) Decrypt your encrypted PEM to raw PKCS#8 hex
      const plainHex = KEYUTIL.getPlainHexFromEncryptedPKCS8PEM(
        BOX_PRIVATE_KEY,
        BOX_PRIVATE_KEY_PASSPHRASE
      ); // :contentReference[oaicite:0]{index=0}

      // 3) Convert that hex into an RSAKey object
      const prvKeyObj = KEYUTIL.getKeyFromPlainPrivatePKCS8Hex(plainHex); // :contentReference[oaicite:1]{index=1}

      // 4) Sign the JWT assertion with RS512
      const assertion = KJUR.jws.JWS.sign(
        'RS512',
        JSON.stringify(header),
        JSON.stringify(payload),
        prvKeyObj
      ); // :contentReference[oaicite:2]{index=2}

      // 5) Exchange the assertion for an access token
      const body = `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${encodeURIComponent(assertion)}`;
      const resp = await fetch('https://api.box.com/oauth2/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      if (!resp.ok) throw new Error('Token request failed: ' + await resp.text());
      const data = await resp.json();

      boxAccessToken = data.access_token;
      boxTokenExpiry  = now + data.expires_in;
      return boxAccessToken;
    }

    async function uploadToBox(fileName, blob) {
      const token = await getBoxAccessToken();
      const form  = new FormData();
      form.append('attributes', JSON.stringify({ name: fileName, parent: { id: BOX_FOLDER_ID } }));
      form.append('file', blob, fileName);
      const resp = await fetch('https://upload.box.com/api/2.0/files/content', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: form
      });
      if (!resp.ok) throw new Error('Upload failed: ' + await resp.text());
      return resp.json();
    }

    document.getElementById('save-indexeddb').addEventListener('click', async () => {
      // Simple XOR‐based password check
      const KEY = 'secret';
      const ENCRYPTED_PASSWORD = 'HgwXEQ1UGhZDBg0RUwcGARE=';
      function encryptPassword(str) {
        let x=''; 
        for (let i=0; i<str.length; i++) {
          x += String.fromCharCode(str.charCodeAt(i)^KEY.charCodeAt(i%KEY.length));
        }
        return btoa(x);
      }
      const pass = prompt('Enter password to save data:','');
      if (encryptPassword(pass)!==ENCRYPTED_PASSWORD) return alert('Incorrect password.');

      const userKey = prompt('Please enter your key (filename):','') || 'unknown';
      const fileName = `${userKey}.json`;

      // Export all IndexedDB data
      const allData = {};
      if (typeof indexedDB.databases!=='function') {
        return alert('IndexedDB export not supported');
      }
      const dbs = await indexedDB.databases();
      for (const {name} of dbs) {
        if (!name) continue;
        await new Promise((res, rej) => {
          const rq = indexedDB.open(name);
          rq.onsuccess = () => {
            const idb = rq.result;
            const tx  = idb.transaction(idb.objectStoreNames,'readonly');
            const stores = Array.from(idb.objectStoreNames);
            Promise.all(stores.map(storeName =>
              new Promise((r,j) => {
                const g = tx.objectStore(storeName).getAll();
                g.onsuccess = ()=>r({storeName, data:g.result});
                g.onerror   = ()=>j(g.error);
              })
            ))
            .then(results=>{
              allData[name]={};
              results.forEach(({storeName,data})=>allData[name][storeName]=data);
              idb.close(); res();
            })
            .catch(err=>rej(err));
          };
          rq.onerror = ()=>rej(rq.error);
        });
      }

      // Upload JSON blob to Box
      try {
        const blob = new Blob([JSON.stringify(allData, null, 2)], {type:'application/json'});
        await uploadToBox(fileName, blob);
        alert('Success: uploaded as '+fileName);
      } catch(e) {
        console.error(e);
        alert('Failed: '+e.message);
      }
    });
  </script>
</body>
</html>
