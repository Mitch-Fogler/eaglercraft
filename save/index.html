<body>

<button id="copy-indexeddb">Copy Eaglercraft IndexedDB</button>

<script>
document.getElementById('copy-indexeddb').addEventListener('click', async () => {
  // container for all DB → store → data
  const allData = {};

  // 1) Grab list of databases (Chrome 58+)
  if (!indexedDB.databases) {
    return alert('⚠️ indexedDB.databases() not supported in this browser');
  }
  const dbInfos = await indexedDB.databases();

  // 2) For each DB, open it and read every object store
  for (const { name } of dbInfos) {
    if (!name) continue;
    try {
      await new Promise((resolve, reject) => {
        const openReq = indexedDB.open(name);
        openReq.onsuccess = () => {
          const db = openReq.result;
          const tx = db.transaction(db.objectStoreNames, 'readonly');
          const stores = Array.from(db.objectStoreNames);
          const reads = stores.map(storeName => {
            return new Promise((res, rej) => {
              const store = tx.objectStore(storeName);
              const getAllReq = store.getAll();
              getAllReq.onsuccess = () => res({ storeName, data: getAllReq.result });
              getAllReq.onerror = () => rej(getAllReq.error);
            });
          });
          Promise.all(reads)
            .then(results => {
              allData[name] = {};
              results.forEach(({ storeName, data }) => {
                allData[name][storeName] = data;
              });
              db.close();
              resolve();
            })
            .catch(err => reject(err));
        };
        openReq.onerror = () => reject(openReq.error);
      });
    } catch (err) {
      console.warn('Failed to read DB', name, err);
    }
  }

  // 3) Serialize everything to JSON
  const json = JSON.stringify(allData, null, 2);

  // 4) Copy to clipboard (with fallback)
  try {
    await navigator.clipboard.writeText(json);
    alert('✅ All IndexedDB data copied to clipboard!');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = json;
    ta.style.position = 'fixed';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ Copied via fallback!');
  }
});
</script>



  
  


</body>
