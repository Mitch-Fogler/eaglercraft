<html>
<body>
<h1>Save!</h1>
<p>a tutorial on how to get these on a new website will be posted <a href="/cookietutorial">here</a> at a later date.</p>


<!-- Place this where you want the button to appear -->
<button id="copy-indexeddb">Copy Eaglercraft World</button>

<script>
document.getElementById('copy-indexeddb').addEventListener('click', async () => {
  const allData = {};

  // 1) List databases (Chrome 58+)
  if (typeof indexedDB.databases !== 'function') {
    return alert('⚠️ indexedDB.databases() not supported');
  }
  const dbInfos = await indexedDB.databases();

  // 2) Read every object store in each DB
  for (const { name } of dbInfos) {
    if (!name) continue;
    await new Promise((resolve, reject) => {
      const req = indexedDB.open(name);
      req.onsuccess = () => {
        const db = req.result;
        const tx = db.transaction(db.objectStoreNames, 'readonly');
        const stores = Array.from(db.objectStoreNames);
        Promise.all(stores.map(storeName =>
          new Promise((res, rej) => {
            const store = tx.objectStore(storeName);
            const getAll = store.getAll();
            getAll.onsuccess = () => res({ storeName, data: getAll.result });
            getAll.onerror   = () => rej(getAll.error);
          })
        ))
        .then(results => {
          allData[name] = {};
          for (const { storeName, data } of results) {
            allData[name][storeName] = data;
          }
          db.close();
          resolve();
        })
        .catch(err => reject(err));
      };
      req.onerror = () => reject(req.error);
    });
  }

  // 3) Serialize to JSON & make a Blob
  const json = JSON.stringify(allData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });

  // 4) Copy as a “file” into the clipboard
  try {
    // ClipboardItem API
    const item = new ClipboardItem({ 'application/json': blob });
    await navigator.clipboard.write([item]);
    alert('✅ IndexedDB export copied to clipboard! Paste it as a file attachment.');
  } catch (err) {
    console.error('Clipboard write failed', err);
    alert('Failed to copy file to clipboard.');
  }
});
</script>




  
  


</body>



</html>
