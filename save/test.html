<body>
  <h1>Save!</h1>

  <button id="save-indexeddb">Save</button>

    const BOX_PRIVATE_KEY_PASSPHRASE = 'ecaa0ecb154f6123abd98aed3eccc4c7';
    const BOX_FOLDER_ID = '320902275630';

    // Parse private key
    const BOX_PRIVATE_KEY_OBJ = KEYUTIL.getKey(BOX_PRIVATE_KEY, BOX_PRIVATE_KEY_PASSPHRASE);

    let boxAccessToken = null;
    let boxTokenExpiry = 0;

    /**
     * XOR-encrypts a string with KEY, then base64-encodes.
     */
    function encryptPassword(input) {
      let xored = '';
      for (let i = 0; i < input.length; i++) {
        xored += String.fromCharCode(input.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length));
      }
      return btoa(xored);
    }

    /**
     * Generates or reuses a JWT-based Box API bearer token for an App User.
     */
    async function getBoxAccessToken() {
      const now = KJUR.jws.IntDate.get('now');
      if (boxAccessToken && now < boxTokenExpiry - 60) {
        return boxAccessToken;
      }
      const header = { alg: 'RS512', typ: 'JWT', kid: BOX_PUBLIC_KEY_ID };
      const payload = {
        iss: BOX_CLIENT_ID,
        sub: BOX_APP_USER_ID,
        box_sub_type: 'user',
        aud: 'https://api.box.com/oauth2/token',
        jti: KJUR.crypto.Util.getRandomHexOfNbytes(16),
        iat: now,
        exp: now + 45
      };
      const assertion = KJUR.jws.JWS.sign(
        'RS512',
        JSON.stringify(header),
        JSON.stringify(payload),
        BOX_PRIVATE_KEY_OBJ
      );
      const params = new URLSearchParams({
        grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
        assertion,
        client_id: BOX_CLIENT_ID,
        client_secret: BOX_CLIENT_SECRET
      });
      const response = await fetch('https://api.box.com/oauth2/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });
      if (!response.ok) {
        const err = await response.text();
        console.error('Token request failed:', err);
        throw new Error('Token request failed: ' + err);
      }
      const data = await response.json();
      boxAccessToken = data.access_token;
      boxTokenExpiry = KJUR.jws.IntDate.get('now') + data.expires_in;
      return boxAccessToken;
    }

    /**
     * Uploads a Blob to Box as a new file in the configured folder.
     */
    async function uploadToBox(fileName, blob) {
      const token = await getBoxAccessToken();
      const form = new FormData();
      form.append('attributes', JSON.stringify({ name: fileName, parent: { id: BOX_FOLDER_ID } }));
      form.append('file', blob, fileName);
      const resp = await fetch('https://upload.box.com/api/2.0/files/content', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: form
      });
      if (!resp.ok) {
        const err = await resp.text();
        console.error('Upload failed:', err);
        throw new Error('Upload failed: ' + err);
      }
      return resp.json();
    }

    /**
     * Exports all IndexedDB databases and object stores into a JSON blob.
     */
    async function exportIndexedDB() {
      if (!indexedDB || typeof indexedDB.databases !== 'function') {
        throw new Error('IndexedDB export not supported in this browser.');
      }
      const result = {};
      const dbInfos = await indexedDB.databases();
      for (const { name } of dbInfos) {
        if (!name) continue;
        const req = indexedDB.open(name);
        const storesData = {};
        await new Promise((resolve, reject) => {
          req.onsuccess = () => {
            const db = req.result;
            const tx = db.transaction(db.objectStoreNames, 'readonly');
            const stores = Array.from(db.objectStoreNames);
            Promise.all(
              stores.map(storeName =>
                new Promise((res, rej) => {
                  const getAll = tx.objectStore(storeName).getAll();
                  getAll.onsuccess = () => res({ storeName, data: getAll.result });
                  getAll.onerror = () => rej(getAll.error);
                })
              )
            )
              .then(entries => {
                entries.forEach(({ storeName, data }) => {
                  storesData[storeName] = data;
                });
                db.close();
                resolve();
              })
              .catch(reject);
          };
          req.onerror = () => reject(req.error);
        });
        result[name] = storesData;
      }
      return new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
    }

    // Main click handler
    document.getElementById('save-indexeddb').addEventListener('click', async () => {
      try {
        const password = prompt('Enter password to save data:', '');
        if (encryptPassword(password) !== ENCRYPTED_PASSWORD) {
          return alert('Incorrect password.');
        }
        const filenameKey = prompt('Enter filename (without extension):', '') || 'export';
        const fileName = filenameKey + '.json';
        const dataBlob = await exportIndexedDB();
        await uploadToBox(fileName, dataBlob);
        alert('Success: Data uploaded as ' + fileName);
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    });
  })();
  </script>
